<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькуляторы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light pb-5">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-10 bg-white p-5 rounded shadow-sm mb-5">
                <h1 class="text-center mb-5 display-6">Решение квадратного уравнения <br> ax^2+bx+c=0</h1>
                
                <div class="row">    
                    <div class="col-md-6">
                        <div class="row">
                            <div class="col-md-7">
                                <div class="mb-3">
                                    <label class="form-label text-muted">A</label>
                                    <input type="number" class="form-control" id="coefA" value="1">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-muted">B</label>
                                    <input type="number" class="form-control" id="coefB" value="1">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-muted">C</label>
                                    <input type="number" class="form-control" id="coefC" value="1">
                                </div>
                                <button class="btn btn-primary w-100" id="btnSquare">Рассчитать</button>
                            </div>
                            <div class="col-md-5 d-flex flex-column justify-content-center mt-4 mt-md-0 ps-md-4">
                                <h4 class="text-end mb-3">Решение</h4>
                                <div id="squareResult" class="text-end fw-bold fs-5">Корней нет. D < 0</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-10 bg-white p-5 rounded shadow-sm">
                <h1 class="text-center mb-5 display-5">Депозитный калькулятор</h1>
                
                <div class="row">
                    <div class="col-md-5 mb-4 mb-md-0">
                        <div class="mb-3">
                            <label class="form-label">Сумма вклада:</label>
                            <input type="number" class="form-control" id="depositSum" value="10000">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Срок вклада (месяцев):</label>
                            <select class="form-select" id="depositTerm">
                                <option value="3">3</option>
                                <option value="6">6</option>
                                <option value="12">12</option>
                                <option value="18">18</option>
                                <option value="24">24</option>
                                <option value="30" selected>30</option>
                                <option value="36">36</option>
                                <option value="42">42</option>
                                <option value="48">48</option>
                                <option value="54">54</option>
                                <option value="60">60</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Годовая процентная ставка (%):</label>
                            <input type="number" class="form-control" id="depositRate" value="5">
                        </div>
                        <button class="btn btn-primary mt-3 w-100" id="btnCalculate">Рассчитать</button>
                    </div>

                    <div class="col-md-7 ps-md-5">
                        <div class="row text-center">
                            <div class="col-6">
                                <h5 class="fw-bold">Было</h5>
                                <hr>
                                <p id="sumBefore" class="fs-5">10000</p>
                            </div>
                            <div class="col-6">
                                <h5 class="fw-bold">Станет</h5>
                                <hr>
                                <p id="sumAfter" class="fs-5">11297</p>
                            </div>
                        </div>

                        <div class="d-flex justify-content-around align-items-end mt-4" style="height: 150px;">
                            <div id="barBefore" class="bar-red"></div>
                            <div id="barAfter" class="bar-green"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
